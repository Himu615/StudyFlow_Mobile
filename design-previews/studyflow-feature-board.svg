  <rect width="1600" height="1060" fill="url(#bg)"/>
  <text x="52" y="55" font-family="Arial" font-size="30" font-weight="700" fill="#123d46">StudyFlow Mobile · feature-based UI concept</text>
  <text x="52" y="84" font-family="Arial" font-size="15" fill="#5b7780">Inspired by your reference style: soft aqua background, green action cards, rounded surfaces and clear student workflows.</text>

